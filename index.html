<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>看護 訪問スケジュール盤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 盤面：ツールバー → 時刻の盤面（列＝A/B/C…のコース）＋ 未配置トレイ。色はライトモードだけ。 */
:root{
  color-scheme:light;
  --bg:#F3F7F6;--panel:#FFFFFF;--line:#D6E0DE;--line2:#E8EFED;--ink:#1D2826;--ink2:#566461;
  --accent:#00897D;--accent-ink:#FFFFFF;--accent-soft:#DCF2EF;
  --k-bg:#DBEDFA;--k-bd:#86B6DC;--k-ink:#174A6E;
  --i-bg:#E0F0D5;--i-bd:#8CBE6A;--i-ink:#2C5614;
  --n-bg:#FFF16E;--n-bd:#D2B900;--n-ink:#4A4000;
  --m-bg:#FFFAD9;--m-bd:#E3D58F;--m-ink:#5E5215;
  --danger:#C62F2F;--danger-soft:#FBE3E3;--warn:#B87400;--lunch:#EDF2F1;
  --f:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;font-variant-numeric:tabular-nums}
h1{font-size:19px;margin:0;font-weight:700}
h3{font-size:14px;margin:0 0 8px;font-weight:700}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,select:focus-visible,input:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.top{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.note{font-size:12px;color:var(--ink2)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.dlabel{font-size:18px;font-weight:700;min-width:11em}
.wk{display:inline-block;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 7px;font-size:13px;margin-left:4px;vertical-align:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--panel)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;border:1px solid var(--line);background:var(--panel)}
.chip.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.dirty{display:flex;gap:8px;align-items:center;background:var(--n-bg);border:1px solid var(--n-bd);color:var(--n-ink);border-radius:8px;padding:4px 6px 4px 12px;font-weight:700}
.modehint{font-size:12px;color:var(--ink2)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px;margin-top:10px;align-items:start}
.main.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:880px){.main{grid-template-columns:minmax(0,1fr)}}
.boardwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 8px 10px}
.board{display:grid;grid-template-columns:44px repeat(var(--n),minmax(124px,1fr)) 58px;min-width:calc(102px + var(--n) * 124px)}
.lh{padding:4px 4px 6px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.lh .lt{display:flex;align-items:center;justify-content:space-between;font-weight:700}
.lh .x{padding:0 7px;font-size:12px;color:var(--ink2)}
.lh select{width:100%}
.lh select.dup{border-color:var(--danger);color:var(--danger)}
.lh .who{font-size:13px}
.lh .cnt{font-size:11px;color:var(--ink2)}
.band{grid-column:1/-1;display:flex;gap:16px;font-size:12px;padding:3px 8px;margin-bottom:4px;border-radius:6px;background:var(--m-bg);color:var(--m-ink)}
.tcol{position:relative;height:var(--H)}
.tcol span{position:absolute;right:6px;font-size:11px;color:var(--ink2);transform:translateY(-50%)}
.tcol span.h{color:var(--ink);font-weight:700}
.lane{position:relative;height:var(--H);border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour)),repeating-linear-gradient(to bottom,var(--line2) 0 1px,transparent 1px var(--half))}
.lane.over{background-color:var(--accent-soft)}
.lunch{position:absolute;left:0;right:0;background:var(--lunch);opacity:.85;font-size:11px;color:var(--ink2);text-align:center;padding-top:2px}
.card{position:absolute;left:3px;right:3px;border-radius:6px;border:1px solid;padding:2px 6px;font-size:12px;line-height:1.28;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;z-index:1}
.admin .card{cursor:grab;touch-action:none}
.card .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k{background:var(--k-bg);border-color:var(--k-bd);color:var(--k-ink)}
.i{background:var(--i-bg);border-color:var(--i-bd);color:var(--i-ink)}
.n{background:var(--n-bg);border-color:var(--n-bd);color:var(--n-ink)}
.m{background:var(--m-bg);border-color:var(--m-bd);color:var(--m-ink);border-style:dashed}
.card.bad,.wcard.bad{outline:2px solid var(--danger);outline-offset:-1px}
.card.warn{outline:2px dashed var(--warn);outline-offset:-1px}
.card.picked{outline:2px solid var(--accent);outline-offset:1px}
.flag{font-weight:700}
.flag.bad{color:var(--danger)}.flag.warn{color:var(--warn)}
.wkb{display:inline-block;margin-right:4px;font-size:11px;font-weight:700;line-height:1.25;padding:0 4px;border-radius:4px;border:1.5px solid currentColor;background:var(--panel);white-space:nowrap}
.ghost{position:absolute;left:3px;right:3px;border:2px dashed var(--accent);border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 2px}
.preview{position:absolute;left:3px;right:3px;border:2px dashed var(--accent);border-radius:6px;z-index:3;pointer-events:none;font-size:11px;color:var(--accent);padding:1px 5px;font-weight:700;background:rgba(220,242,239,.6)}
.dragging{position:fixed;pointer-events:none;z-index:60;opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.2);left:0;top:0}
.addcol{border-left:1px solid var(--line);display:flex;align-items:flex-start;justify-content:center;padding-top:4px}
.tray{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px}
.tray.over{outline:2px dashed var(--accent)}
.tray .card{position:relative;left:auto;right:auto;height:auto;padding:4px 8px}
.tray .list{display:flex;flex-direction:column;gap:6px;min-height:40px}
.tray .why{font-size:11px}
.tray .more{float:right;font-size:11px;padding:0 6px;margin-left:4px}
.linkish{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.empty{font-size:12px;color:var(--ink2);border:1px dashed var(--line);border-radius:6px;padding:8px;text-align:center}
.small{font-size:12px;color:var(--ink2)}
.rowf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.form{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
.form input[type=text]{width:100%}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:12px}
ul.plain li{display:flex;justify-content:space-between;gap:6px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2);margin-top:8px}
.sw{display:inline-block;width:14px;height:11px;border-radius:3px;border:1px solid;vertical-align:-1px;margin-right:4px}
.listview{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.lv{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.lv.mine{border:2px solid var(--accent)}
.lv h3{display:flex;justify-content:space-between}
.lv ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.lv li > span:first-child{white-space:nowrap}
.lv li{display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:14px;border-radius:6px;padding:4px 6px;border:1px solid}
.week{display:flex;gap:6px;overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px}
.wtime{flex:0 0 40px}
.wday{flex:1 0 calc(var(--wn) * 80px);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.wday.cur{border-color:var(--accent)}
.whead{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;width:100%;height:50px;border:0;border-radius:0;background:var(--line2);padding:3px 6px;text-align:left}
.wtime .whead{background:none}
.whead .wk{margin-left:0;font-size:11px}
.wlh{display:grid;grid-template-columns:repeat(var(--wn),minmax(0,1fr));height:20px;font-size:11px;color:var(--ink2)}
.wtime .wlh{display:block}
.wlh span{border-left:1px solid var(--line);padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wgrid{display:grid;grid-template-columns:repeat(var(--wn),minmax(0,1fr))}
.wgrid .lane{min-width:0}
.wcard{position:absolute;left:2px;right:2px;border-radius:5px;border:1px solid;padding:1px 3px;letter-spacing:-.02em;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;z-index:1}
.admin .wcard{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.wcard .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wcard .wkb{padding:0 3px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(410px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:50;overflow:auto;overflow-x:hidden;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;box-shadow:-10px 0 28px rgba(0,0,0,.14)}
.drawer section{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dh h2{font-size:18px;margin:4px 0 0;font-weight:700}
.pill{display:inline-block;font-size:12px;border-radius:5px;padding:1px 8px;border:1px solid}
.slot{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.slot label{font-size:12px;white-space:nowrap}
.slot label.blk{display:flex;flex-direction:column;gap:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:13px;z-index:70;max-width:calc(100% - 32px)}
.help{font-size:12px;color:var(--ink2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 16px}
.login{max-width:340px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login input{font-size:20px;letter-spacing:.3em;text-align:center;padding:8px}
.err{color:var(--danger);font-size:13px}
.printtitle{display:none}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .12s}}
@page{size:A4 landscape;margin:8mm}
@media print{
  body{background:#fff;padding:0}
  .top,.bar,.tray,.legend,.help,.drawer,.toast,.lh .x,#addLane,.ghost,.dirty{display:none!important}
  .printtitle{display:block;font-size:16px;font-weight:700;margin:0 0 4px}
  .main{display:block;margin:0}
  .boardwrap{overflow:visible;border:0;padding:0}
  .board{min-width:0}
  .card,.wcard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div id="loginView" hidden>
  <form class="login" id="loginForm">
    <h1>看護 訪問スケジュール盤</h1>
    <label for="pin" class="small">PINを入れてください</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" aria-label="PIN">
    <button class="primary" type="submit">ひらく</button>
    <div class="err" id="loginErr" hidden></div>
  </form>
</div>

<div id="app" hidden>
<div class="top">
  <h1>看護 訪問スケジュール盤</h1>
  <span class="note" id="roleNote"></span>
  <span style="flex:1"></span>
  <button id="reload">最新にする</button>
  <button id="printBtn">印刷</button>
  <button id="logout">ログアウト</button>
</div>

<div class="err" id="problems" hidden></div>

<div class="bar">
  <button id="prev" aria-label="前へ">◀</button>
  <span class="dlabel" id="dlabel"></span>
  <button id="next" aria-label="次へ">▶</button>
  <input type="date" id="dpick" aria-label="日付を選ぶ">
  <button id="today">今日</button>
  <span style="flex:1"></span>
  <div class="dirty" id="dirty" hidden><span id="dirtyText"></span><button id="undo">1つ戻す</button><button class="primary" id="commit">まとめて確定</button></div>
</div>

<div class="bar">
  <div class="seg adminOnly" role="group" aria-label="変更の範囲">
    <button id="mDay" aria-pressed="true">この日だけ変える</button>
    <button id="mWeek" aria-pressed="false">毎週の型を変える</button>
  </div>
  <span class="modehint adminOnly" id="modehint"></span>
  <span style="flex:1"></span>
  <div class="seg" role="group" aria-label="表示">
    <button id="vBoard" aria-pressed="true">盤面</button>
    <button id="vWeek" aria-pressed="false">週の一覧（月〜金）</button>
    <button id="vList" aria-pressed="false">担当ごとの一覧</button>
  </div>
</div>

<div class="bar">
  <div class="chips" id="chips"></div>
  <span style="flex:1"></span>
  <label class="small viewOnly">自分の列 <select id="myLane"><option value="">（全部）</option></select></label>
  <button id="copyPrev" class="adminOnly">先週の同じ曜日から列と担当を写す</button>
</div>

<div class="main">
  <div>
    <div class="printtitle" id="printTitle"></div>
    <div class="boardwrap" id="boardwrap"><div class="board" id="board"></div></div>
    <div class="listview" id="listview" hidden></div>
    <div class="week" id="weekview" hidden></div>
    <div class="legend">
      <span><span class="sw k"></span>介護保険</span>
      <span><span class="sw i"></span>医療保険</span>
      <span><span class="sw n"></span>新規</span>
      <span><span class="sw m"></span>その他（施設・サ担・会議）</span>
      <span style="color:var(--danger)">赤枠＝時間が重なっている</span>
    </div>
    <div class="help adminOnly">
      <span>カードを動かす：ドラッグ（10分刻み）</span>
      <span>カードを押す：時間・週の決まり・特指示を直す</span>
      <span>未配置のカードを押す：空いている所を点線で表示</span>
      <span>週の一覧でも、カードを別の曜日の列へドラッグできます（「毎週の型」なら曜日ごと、「この日だけ」ならその週だけ）</span>
      <span>動かしただけでは保存されません。「まとめて確定」で保存します</span>
    </div>
  </div>
  <aside class="tray" id="tray"></aside>
</div>
</div>

<div class="drawer" id="drawer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="logic.js"></script>
<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxoZQbEMT9AMOkCy2k2B6JdtnDUHbI0_m_7DtLJE6aGOE4OI9mFLChZvECLe2Ur6T4/exec';   // GAS の /exec（デプロイ手順.md）
const K = KangoBan, PX = 1.3, T0 = K.T0, T1 = K.T1, LUNCH = K.LUNCH, DOW = '日月火水木金土', LETTERS = 'ABCDEFGH';
const LS = { token: 'kango-ban-token', dev: 'kango-ban-device', lane: 'kango-ban-mylane' };
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, '0');
const hm = K.fmtHm;
const toMin = (s) => K.parseHm(s);
const ds = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const snap10 = (m) => Math.round(m / 10) * 10;
const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* 覚えられなくても動く */ } };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(16) + '-' + Math.random().toString(16).slice(2, 10));
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function nextWeekday(d, step) { let x = new Date(d); do { x = addDays(x, step); } while (x.getDay() === 0 || x.getDay() === 6); return x; }
function baseDate() { const t = new Date(); t.setHours(0, 0, 0, 0); return (t.getDay() === 0 || t.getDay() === 6) ? nextWeekday(t, 1) : t; }

let S = null, PROBLEMS = [], VERSION = '', ADMIN = false, BASE = '', cur = ds(baseDate()), mode = 'day', view = 'board', pick = null, drawerRef = null, undo = [], R = null, busy = false;
const board = $('#board'), tray = $('#tray'), drawer = $('#drawer');
document.documentElement.style.setProperty('--H', ((T1 - T0) * PX) + 'px');
document.documentElement.style.setProperty('--hour', (60 * PX) + 'px');
document.documentElement.style.setProperty('--half', (30 * PX) + 'px');

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 3000); }

// ── API ──
async function api(body) {
  if (window.KangoMock) return window.KangoMock.call(body);
  if (!API_URL) return { ok: false, error: 'API の URL が未設定です（デプロイ手順.md）' };
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
      return await r.json();
    } catch (e) { if (i === 1) return { ok: false, error: '通信できませんでした。電波の良い所でもう一度お試しください' }; }
  }
}
function deviceId() { let d = lsGet(LS.dev); if (!d) { d = 'dev-' + uuid(); lsSet(LS.dev, d); } return d; }

function showLogin(msg) {
  $('#app').hidden = true; $('#loginView').hidden = false; closeDrawer();
  const e = $('#loginErr'); e.textContent = msg || ''; e.hidden = !msg; $('#pin').value = ''; $('#pin').focus();
}
$('#loginForm').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const pin = $('#pin').value.trim();
  if (!pin) { showLogin('PINを入れてください'); return; }
  const r = await api({ action: 'login', pin, deviceId: deviceId(), requestId: uuid() });
  if (!r.ok) { showLogin(r.error); return; }
  lsSet(LS.token, r.data.token);
  await loadBoard(true);
});
$('#pin').addEventListener('input', () => { $('#loginErr').hidden = true; });

async function loadBoard(first) {
  const r = await api({ action: 'board', token: lsGet(LS.token) });
  if (!r.ok) { if (r.authError) { lsSet(LS.token, null); showLogin(r.error); } else toast(r.error); return false; }
  S = r.data.state; VERSION = r.data.version; ADMIN = r.data.role === 'admin'; PROBLEMS = r.data.problems || []; BASE = JSON.stringify(S); undo = []; pick = null;
  document.body.classList.toggle('admin', ADMIN);
  document.querySelectorAll('.adminOnly').forEach((el) => (el.hidden = !ADMIN));
  document.querySelectorAll('.viewOnly').forEach((el) => (el.hidden = ADMIN));
  if (first && !ADMIN) view = 'list';
  $('#roleNote').textContent = ADMIN ? '管理者：動かしてから「まとめて確定」で保存します' : '看護師：見るだけ（組み替えは管理者がします）';
  $('#loginView').hidden = true; $('#app').hidden = false;
  if (drawerRef) buildDrawer();

  return true;
}

// ── 状態の操作（下書き） ──
function snap() { undo.push(JSON.stringify(S)); if (undo.length > 80) undo.shift(); }
function dayObj(date, create) { if (!S.days[date]) { if (!create) return {}; S.days[date] = {}; } return S.days[date]; }
function setMove(date, key, v) { const d = dayObj(date, true); (d.moves || (d.moves = {}))[key] = v; }
function clearMove(date, key) { const d = S.days[date]; if (d && d.moves) delete d.moves[key]; }
function lanesOf(date) { return (S.days[date] && S.days[date].lanes) || S.settings.defLanes.slice(); }
const client = (id) => S.clients.find((c) => c.id === id);
const slotOf = (id) => S.slots.find((s) => s.id === id);
const allItems = () => (R ? [...R.placed, ...R.tray, ...R.off] : []);
const findItem = (k) => allItems().find((i) => i.key === k);
const nameOf = (it) => (it.kind === 'e' ? it.title : (client(it.clientId) || {}).name || '');

function typeCls(it) { if (it.kind === 'e') return 'm'; const c = client(it.clientId) || {}; if (c.ins === 'm') return 'm'; if (c.isNew) return 'n'; return c.ins === 'i' ? 'i' : 'k'; }
function weekBadge(it) { return it.kind === 's' && it.weeks && it.weeks.length ? `<span class="wkb" title="毎週ではない（第${it.weeks.join('・')}週だけ訪問）">第${it.weeks.join('・')}週</span>` : ''; }
function ruleTags(it) {
  const t = [], c = it.kind === 'e' ? null : client(it.clientId);
  if (it.kind === 'p') t.push('特指示');
  if (c && c.isNew) t.push('新規');
  if (it.moved && it.kind !== 'e') t.push('この日だけ');
  if (c && c.note) t.push('※' + c.note);
  return t;
}
function cardHTML(it, inTray) {
  const pos = inTray ? '' : ` style="top:${(it.start - T0) * PX}px;height:${it.min * PX - 2}px"`;
  const tags = ruleTags(it);
  let flag = '';
  if (it.bad) flag = '<span class="flag bad">重なり </span>'; else if (it.warn) flag = '<span class="flag warn">間が短い </span>';
  const time = inTray && it.start != null && it.kind !== 'u' ? `${hm(it.start)}〜 ` : '';
  const sub = `${weekBadge(it)}${flag}${time}${it.min}分${tags.length ? '・' + tags.join('・') : ''}`;
  const more = inTray && ADMIN ? `<button class="more" data-more="${esc(it.key)}">詳しく</button>` : '';
  const why = inTray && it.why ? `<div class="why">${esc(it.why)}</div>` : '';
  return `<div class="card ${typeCls(it)}${it.bad ? ' bad' : ''}${it.warn ? ' warn' : ''}${pick === it.key ? ' picked' : ''}" data-key="${esc(it.key)}" tabindex="0"${pos}>${more}<div class="nm">${esc(nameOf(it))}</div><div class="sub">${sub}</div>${why}</div>`;
}

// ── 組み替え（管理者だけ） ──
function applyPlace(it, lane, start) {
  if (!ADMIN) return;
  snap(); const dow = parse(cur).getDay();
  if (mode === 'week' && (it.kind === 's' || it.kind === 'u')) {
    if (it.kind === 's') { const s = slotOf(it.slotId); s.lane = lane; s.start = start; clearMove(cur, it.key); }
    else S.slots.push({ id: newId('s'), clientId: it.clientId, dow, lane, start, min: it.min, weeks: null });
    toast(`毎週${DOW[dow]}曜の型：${nameOf(it)} を ${lane}列 ${hm(start)} に`);
  } else {
    if (it.kind === 'u') { const day = dayObj(cur, true); (day.adds || (day.adds = [])).push({ id: newId('a'), clientId: it.clientId, lane, start, min: it.min }); }
    else if (it.kind === 'a') { const a = dayObj(cur, true).adds.find((x) => x.id === it.addId); a.lane = lane; a.start = start; }
    else if (it.kind === 'e') { const e = S.events.find((x) => x.id === it.eventId); e.lane = lane; e.start = start; }
    else setMove(cur, it.key, { lane, start, min: it.min });
    toast(`${md(cur)}だけ：${nameOf(it)} を ${lane}列 ${hm(start)} に` + (mode === 'week' && it.kind !== 'u' ? (it.kind === 'p' ? '（特指示は毎日その日ごとに入れます）' : '（この予定は日付のものです）') : ''));
  }
  pick = null; render(); if (drawerRef) buildDrawer();
}
// 週の一覧で別の日（曜日）へ移す。「毎週の型」なら曜日そのものを、「この日だけ」ならその週だけを変える。
let suppressWeekClick = false;
function applyWeekMove(it, from, to, lane, start) {
  if (!ADMIN) return;
  const name = nameOf(it), weekly = mode === 'week';
  const r = K.moveToDay(S, from, it.key, to, lane, start, weekly, newId('a'));
  if (r.error) { toast(r.error); render(); return; }
  snap(); S = r.state; render();
  const toDow = DOW[parse(to).getDay()];
  if (from === to) toast(`${md(from)}だけ：${name} を ${lane}列 ${hm(start)} に`);
  else if (weekly && it.kind === 's') toast(`毎週の型：${name} を 毎週${toDow}曜 ${lane}列 ${hm(start)} に`);
  else toast(`${name} を ${md(from)} から ${md(to)}（${toDow}）${lane}列 ${hm(start)} へ（その週だけ）`);
}

function toTray(it) {
  if (!ADMIN || it.kind === 'u') return;
  snap();
  if (it.kind === 'a') { const day = dayObj(cur, true); day.adds = (day.adds || []).filter((a) => a.id !== it.addId); }
  else if (it.kind === 'e') S.events.find((x) => x.id === it.eventId).lane = null;
  else setMove(cur, it.key, { tray: 1 });
  toast(`${md(cur)}だけ：${nameOf(it)} を未配置へ`); render();
}

async function commit() {
  if (!ADMIN || busy) return;
  busy = true; $('#commit').textContent = '保存しています…';
  const r = await api({ action: 'save', token: lsGet(LS.token), requestId: uuid(), version: VERSION, state: S });
  busy = false; $('#commit').textContent = 'まとめて確定';
  if (r.ok) { VERSION = r.data.version; BASE = JSON.stringify(S); undo = []; render(); toast('保存しました'); return; }
  if (r.authError) { lsSet(LS.token, null); showLogin(r.error); return; }
  if (r.conflict) { toast('他の人が先に保存しました。最新の盤面を読み込みました（いまの変更は保存されていません）'); await loadBoard(false); return; }
  toast(r.error);
}

// ── ドラッグ ──
let drag = null;
document.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || e.target.closest('button,select,input')) return;
  const wc = ADMIN && e.target.closest('.wcard[data-wkey]');
  if (wc) {   // 週の一覧のカード：別の日（曜日）の列へ動かせる
    const wit = K.itemsFor(S, wc.dataset.go).placed.find((i) => i.key === wc.dataset.wkey); if (!wit) return;
    const wr = wc.getBoundingClientRect();
    drag = { it: wit, el: wc, week: true, from: wc.dataset.go, x0: e.clientX, y0: e.clientY, dx: e.clientX - wr.left, dy: e.clientY - wr.top, w: wr.width, moved: false, inTray: false, pid: e.pointerId };
    return;
  }
  const el = e.target.closest('.card[data-key]'); if (!el) return;
  const it = findItem(el.dataset.key); if (!it) return;
  const r = el.getBoundingClientRect();
  drag = { it, el, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, moved: false, inTray: !!el.closest('.tray'), pid: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.pid || !ADMIN) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; const g = drag.el.cloneNode(true); g.classList.add('dragging'); g.style.width = Math.max(drag.w, 124) + 'px';
    g.style.height = (drag.it.min * PX - 2) + 'px'; g.querySelector('.more')?.remove(); document.body.appendChild(g); drag.g = g; drag.el.style.opacity = '.35';
  }
  e.preventDefault();
  drag.g.style.transform = `translate(${e.clientX - drag.dx}px,${e.clientY - Math.min(drag.dy, 14)}px)`;
  document.querySelectorAll('.lane.over,.tray.over').forEach((x) => x.classList.remove('over'));
  document.querySelectorAll('.preview').forEach((x) => x.remove()); drag.target = null;
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const lane = under && under.closest(drag.week ? '#weekview .lane[data-date]' : '#board .lane'), tr = !drag.week && under && under.closest('.tray');
  if (lane) {
    const rr = lane.getBoundingClientRect(); let m = T0 + snap10((e.clientY - Math.min(drag.dy, 14) - rr.top) / PX);
    m = Math.max(T0, Math.min(T1 - drag.it.min, m));

  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    await new Promise((res) => { const s = document.createElement('script'); s.src = 'mock.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); });
  }
  if (!lsGet(LS.token)) { showLogin(''); return; }
  await loadBoard(true);
})();
</script>
